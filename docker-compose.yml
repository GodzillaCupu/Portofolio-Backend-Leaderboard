services:
  postgres:
    image: postgres:16
    container_name: leaderboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leaderboard_user
      POSTGRES_PASSWORD: leaderboard_pass
      POSTGRES_DB: leaderboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: leaderboard-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data: